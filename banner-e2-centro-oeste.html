<!DOCTYPE html><html><head><meta charset='utf-8'><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:560px;overflow:hidden;font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#005c56 0%,#0e8f88 48%,#20a9a3 80%,#6fcfca 100%);position:relative;color:#fff;}
.c1{position:absolute;top:-140px;right:-120px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.09);}
.c2{position:absolute;bottom:-180px;left:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.07);}
.c3{position:absolute;bottom:60px;right:140px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);}
.wrap{position:relative;z-index:2;padding:64px 80px;display:flex;flex-direction:column;height:100%;}
img.logo{height:84px;width:auto;align-self:flex-start;}
h1{font-size:62px;line-height:1.15;font-weight:700;margin-top:52px;max-width:900px;letter-spacing:-.01em;}
.pill{margin-top:40px;align-self:flex-start;background:#fff;color:#0b6e68;font-weight:700;font-size:28px;padding:14px 36px;border-radius:999px;letter-spacing:.02em;}
</style></head><body>
<div class='c1'></div><div class='c2'></div><div class='c3'></div>
<div class='wrap'>
<img class='logo' src='medley-logo-branco.png'>
<h1>Para sua farm&aacute;cia, onde est&aacute; a oportunidade?</h1>
<div class='pill'>Regi&atilde;o Centro-Oeste &nbsp;&bull;&nbsp; Conecta PDV</div>
</div></body></html>
